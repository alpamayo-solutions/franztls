name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.12

      - name: Check formatting
        run: |
          # shellcheck disable=SC2046
          test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Tidy modules
        run: go mod tidy

      - name: Check module files
        run: git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test with the race detector
        run: go test -race ./... -count=1

      - name: Check vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Reject module replacements
        run: if git grep -n '^replace ' -- go.mod; then exit 1; fi

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Test
        run: python -m pytest tests/python -q

  package:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -e '.[dev]'

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Smoke test the wheel
        run: |
          python -m venv "${RUNNER_TEMP}/franztls-wheel-smoke"
          "${RUNNER_TEMP}/franztls-wheel-smoke/bin/python" -m pip install dist/franztls-0.2.0-py3-none-any.whl
          "${RUNNER_TEMP}/franztls-wheel-smoke/bin/python" -c 'from importlib.metadata import version; import franztls; assert version("franztls") == franztls.__version__ == "0.2.0"'

  integration:
    name: Docker integration
    needs:
      - go
      - python
      - package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run integration suite
        env:
          FRANZTLS_COMPOSE_LOG_FILE: ${{ runner.temp }}/franztls-compose.log
        run: bash integration/run.sh

      - name: Upload Compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-compose-logs
          path: ${{ runner.temp }}/franztls-compose.log
          if-no-files-found: error
