name: Build & Publish

on:
  push:
    tags:
      - "v*"
    branches:
      - staging

permissions:
  contents: read

jobs:
  go-verify:
    name: Verify Go package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.12

      - name: Check formatting
        run: |
          # shellcheck disable=SC2046
          test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Tidy modules
        run: go mod tidy

      - name: Check module files
        run: git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test with the race detector
        run: go test -race ./... -count=1

      - name: Check vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Reject module replacements
        run: if git grep -n '^replace ' -- go.mod; then exit 1; fi

  python-verify-build:
    name: Verify and build Python package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and build dependencies
        run: python -m pip install -e '.[dev]'

      - name: Test
        run: python -m pytest tests/python -q

      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: python scripts/check-version.py "${GITHUB_REF_NAME}"

      - name: Set beta version for staging
        if: github.ref == 'refs/heads/staging' && matrix.python-version == '3.12'
        env:
          BETA_VERSION: 0.2.0b${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          source = path.read_text()
          replacement = f'version = "{os.environ["BETA_VERSION"]}"'
          updated, count = re.subn(r'(?m)^version = "[^"]+"$', replacement, source)
          if count != 1 or updated == source:
              raise SystemExit("unable to set the staging package version")
          path.write_text(updated)
          PY

      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: python -m build

      - name: Check distributions
        if: matrix.python-version == '3.12'
        run: python -m twine check dist/*

      - name: Smoke test the built wheel
        if: matrix.python-version == '3.12'
        run: |
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name 'franztls-*.whl' -print)
          test "${#wheels[@]}" -eq 1
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected_version="${GITHUB_REF_NAME#v}"
          else
            expected_version="0.2.0b${GITHUB_RUN_NUMBER}"
          fi
          export EXPECTED_VERSION="${expected_version}"
          python -m venv "${RUNNER_TEMP}/franztls-wheel-smoke"
          "${RUNNER_TEMP}/franztls-wheel-smoke/bin/python" -m pip install "${wheels[0]}"
          "${RUNNER_TEMP}/franztls-wheel-smoke/bin/python" -c 'from importlib.metadata import version; import os; import franztls; expected = os.environ["EXPECTED_VERSION"]; assert version("franztls") == expected; assert franztls.__version__ == expected'

      - name: Upload checked distributions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  integration:
    name: Docker integration
    needs:
      - go-verify
      - python-verify-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run integration suite
        env:
          FRANZTLS_COMPOSE_LOG_FILE: ${{ runner.temp }}/franztls-compose.log
        run: bash integration/run.sh

      - name: Upload Compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publish-integration-compose-logs
          path: ${{ runner.temp }}/franztls-compose.log
          if-no-files-found: error

  publish:
    name: Publish Python package
    needs:
      - go-verify
      - python-verify-build
      - integration
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish exact checked distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
